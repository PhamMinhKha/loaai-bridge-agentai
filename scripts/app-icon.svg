<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="55%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="mic" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="wave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0"/>
      <stop offset="50%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded square background for macOS dock -->
  <rect width="1024" height="1024" rx="230" ry="230" fill="url(#bg)"/>

  <!-- Subtle inner ring -->
  <rect x="48" y="48" width="928" height="928" rx="190" ry="190" fill="none" stroke="#60a5fa" stroke-opacity="0.18" stroke-width="4"/>

  <!-- Gateway nodes -->
  <circle cx="512" cy="760" r="34" fill="#2563eb" stroke="#93c5fd" stroke-width="8"/>
  <circle cx="332" cy="820" r="22" fill="#1e40af" stroke="#60a5fa" stroke-width="6"/>
  <circle cx="692" cy="820" r="22" fill="#1e40af" stroke="#60a5fa" stroke-width="6"/>
  <path d="M512 726 L332 798 M512 726 L692 798" stroke="#60a5fa" stroke-width="10" stroke-linecap="round" opacity="0.55"/>

  <!-- Sound waves -->
  <g fill="none" stroke="url(#wave)" stroke-width="18" stroke-linecap="round" opacity="0.9">
    <path d="M248 430 C 190 430, 170 512, 170 512 C 170 512, 190 594, 248 594"/>
    <path d="M188 390 C 110 390, 80 512, 80 512 C 80 512, 110 634, 188 634"/>
    <path d="M776 430 C 834 430, 854 512, 854 512 C 854 512, 834 594, 776 594"/>
    <path d="M836 390 C 914 390, 944 512, 944 512 C 944 512, 914 634, 836 634"/>
  </g>

  <!-- Microphone body -->
  <g filter="url(#glow)">
    <rect x="432" y="250" width="160" height="300" rx="80" fill="url(#mic)"/>
    <path d="M352 470 C352 590, 432 650, 512 650 C592 650, 672 590, 672 470"
          fill="none" stroke="#ffffff" stroke-width="34" stroke-linecap="round"/>
    <rect x="482" y="650" width="60" height="92" rx="16" fill="#ffffff"/>
    <rect x="402" y="730" width="220" height="34" rx="17" fill="#dbeafe"/>
  </g>

  <!-- Accent dot -->
  <circle cx="512" cy="330" r="18" fill="#3b82f6" opacity="0.85"/>
</svg>
